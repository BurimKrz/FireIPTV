# Pushing a tag v<appVersion> builds FireIPTV's signed release APK and publishes it as a GitHub
# release, which the app finds with its daily update check. A tag v<betaVersion> (like
# v1.1.0-beta.2) builds FireIPTV Beta instead and publishes it as a pre-release: only the beta
# app looks at those.
#
# Needs four repository secrets (Settings → Secrets and variables → Actions):
#   FIREIPTV_KEYSTORE_BASE64   base64 of ~/.android/fireiptv-release.jks
#   FIREIPTV_KEYSTORE_PASSWORD
#   FIREIPTV_KEY_ALIAS
#   FIREIPTV_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the app version
        id: version
        run: |
          case "$GITHUB_REF_NAME" in
            *-beta.*) variable=betaVersion; flavor=beta; task=assembleBetaRelease; name=FireIPTV-Beta; prerelease=true ;;
            *)        variable=appVersion;  flavor=stable; task=assembleStableRelease; name=FireIPTV; prerelease=false ;;
          esac
          version=$(sed -nE "s/^val $variable = \"(.*)\"/\\1/p" app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag is $GITHUB_REF_NAME but $variable in app/build.gradle.kts is $version"
            exit 1
          fi
          {
            echo "version=$version"
            echo "flavor=$flavor"
            echo "task=$task"
            echo "apk=$name-$version.apk"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.FIREIPTV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FIREIPTV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FIREIPTV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FIREIPTV_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The FIREIPTV_* signing secrets are missing; a release signed with another key can't update the TV"
            exit 1
          fi
          # Pasting into the secrets page can add spaces or line breaks; they aren't part of base64.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 --decode > "$RUNNER_TEMP/release.jks"; then
            echo "::error::FIREIPTV_KEYSTORE_BASE64 isn't base64. Paste the output of: base64 -w0 ~/.android/fireiptv-release.jks"
            exit 1
          fi
          ./gradlew --no-configuration-cache :app:${{ steps.version.outputs.task }} \
            -Pfireiptv.keystore="$RUNNER_TEMP/release.jks" \
            -Pfireiptv.keystorePassword="$KEYSTORE_PASSWORD" \
            -Pfireiptv.keyAlias="$KEY_ALIAS" \
            -Pfireiptv.keyPassword="$KEY_PASSWORD"
          rm "$RUNNER_TEMP/release.jks"
          cp "app/build/outputs/apk/${{ steps.version.outputs.flavor }}/release/app-${{ steps.version.outputs.flavor }}-release.apk" "${{ steps.version.outputs.apk }}"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.version.outputs.apk }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          # A beta never becomes GitHub's "latest", so FireIPTV never offers it.
          make_latest: ${{ steps.version.outputs.prerelease == 'false' }}
          generate_release_notes: true
