# Every push to dev and every pull request: does it build, and do the JVM tests pass?
# The release build here is unsigned (no secrets on pull requests); release.yml signs tagged builds.
name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew :core:parser:test :app:assembleDebug :app:assembleRelease
