# Every push to dev or Beta and every pull request: does it build, is lint clean, and do the JVM tests pass?
# The release build here is unsigned (no secrets on pull requests); release.yml signs tagged builds.
name: CI

on:
  push:
    branches: [dev, Beta]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        # lintDebug skips the app module, which has a variant per flavor: lint both by name.
        run: ./gradlew :core:parser:test lintDebug :app:lintStableDebug :app:lintBetaDebug :app:assembleDebug :app:assembleRelease
